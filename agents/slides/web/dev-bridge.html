<!doctype html>
<meta charset="utf-8">
<title>Sensor view bridge</title>
<!-- Lets the sensor view on another address listen to the slide page. It passes messages
     between the slide page's channel and the page that embeds it. It shows nothing. -->
<script>
const channel = new BroadcastChannel('npc-dev');
channel.onmessage = e => { try { parent.postMessage(e.data, '*'); } catch (err) {} };
addEventListener('message', e => { if (e.source === parent && e.data && e.data.type === 'watching') channel.postMessage(e.data); });
</script>
